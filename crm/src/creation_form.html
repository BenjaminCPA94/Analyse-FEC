<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Création de votre société</title>
<style>
:root{--ink:#1d2433;--muted:#667085;--line:#e4e7ec;--bg:#f6f7fb;--card:#fff;--accent:#2f5bea;--accent-soft:#eef2fe;--ok:#12805c;--bad:#c4320a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
header .wrap{display:flex;justify-content:space-between;align-items:center;min-height:60px;gap:12px}
.brand{font-weight:650;letter-spacing:.2px}
.progress{font-size:13px;color:var(--muted)}
.bar{height:4px;background:var(--line)}.bar i{display:block;height:4px;background:var(--accent);width:0;transition:width .3s}
h1{font-size:26px;font-weight:600;margin:32px 0 6px}
.lead{color:var(--muted);margin:0 0 24px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 22px 8px;margin-bottom:18px}
section h2{font-size:17px;font-weight:600;margin:0 0 4px}
section .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.field{margin-bottom:16px}
label{display:block;font-weight:500;font-size:14px;margin-bottom:6px}
label .req{color:var(--bad);margin-left:2px}
.fhint{color:var(--muted);font-size:12.5px;margin:-2px 0 6px}
input[type=text],input[type=date],select,textarea{width:100%;font:inherit;color:inherit;padding:10px 12px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.invalid{border-color:var(--bad)!important}
.drop{border:1.5px dashed #c5cbd6;border-radius:8px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.drop span{color:var(--muted);font-size:13px}
.btn{font:inherit;font-weight:550;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;background:var(--accent);color:#fff}
.btn.light{background:var(--accent-soft);color:var(--accent);padding:7px 12px;font-size:13.5px}
.btn:disabled{opacity:.6;cursor:default}
ul.files{list-style:none;margin:8px 0 0;padding:0}
ul.files li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;padding:6px 10px;background:#f8f9fb;border-radius:6px;margin-top:4px}
ul.files button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 48px}
.saved{color:var(--muted);font-size:13px}
.notice{border-radius:10px;padding:14px 16px;margin:18px 0}
.notice.ok{background:#ecfdf3;color:var(--ok);border:1px solid #abefc6}
.notice.bad{background:#fef3f2;color:var(--bad);border:1px solid #fecdca}
.center{text-align:center;padding:80px 0;color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand" id="brand">Votre cabinet</div><div class="progress" id="progress"></div></div><div class="bar"><i id="bar"></i></div></header>
<main class="wrap" id="app"><div class="center">Chargement…</div></main>
<script>/*CREATION_FIELDS*/</script>
<script>
const token=location.pathname.split('/').pop(),api=p=>'/api/public/creation'+p+'?t='+encodeURIComponent(token);
let data={fields:{},files:[]},saveTimer=null,queue=Promise.resolve();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const $=id=>document.getElementById(id);
async function call(path,body){const r=await fetch(api(path),body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Erreur '+r.status);return x;}
function input(f){
 const v=data.fields[f.key]??(f.key==='denomination'?data.name:f.key==='legalForm'?data.legalForm:'')??'',id='f_'+f.key;
 if(f.type==='file')return `<div class="drop"><span>Ajoute un ou plusieurs fichiers</span><label class="btn light" style="margin:0">Choisir un fichier<input hidden type="file" multiple accept=".pdf,image/*" onchange="upload('${f.key}',this.files);this.value=''"></label></div><ul class="files" id="files_${f.key}"></ul>`;
 if(f.type==='select')return `<select id="${id}" oninput="changed()"><option value="">— Choisir —</option>${f.options.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}${v&&!f.options.includes(v)?`<option selected>${esc(v)}</option>`:''}</select>`;
 if(f.type==='textarea')return `<textarea id="${id}" oninput="changed()" placeholder="${esc(f.placeholder||'')}">${esc(v)}</textarea>`;
 return `<input id="${id}" type="${f.type==='date'?'date':'text'}" value="${esc(v)}" oninput="changed()" placeholder="${esc(f.placeholder||'')}">`;
}
function page(){
 let html=`<h1>Création de ${esc(data.name||'votre société')}</h1><p class="lead">Merci de compléter ce formulaire : il réunit tout ce dont nous avons besoin pour rédiger les statuts et déposer le dossier d’immatriculation. Vos réponses sont enregistrées au fur et à mesure ; vous pouvez revenir plus tard avec le même lien.</p>`;
 if(data.submittedAt)html+=`<div class="notice ok">Vos informations ont bien été transmises le ${new Date(data.submittedAt).toLocaleString('fr-FR')}. Vous pouvez encore les compléter : renvoyez simplement le formulaire.</div>`;
 let open=false;
 for(const f of CREATION_FIELDS){
  if(f.section){html+=(open?'</section>':'')+`<section><h2>${esc(f.section)}</h2>${f.hint?`<p class="hint">${esc(f.hint)}</p>`:''}`;open=true;continue;}
  html+=`<div class="field"><label for="f_${f.key}">${esc(f.label)}${f.required?'<span class="req">*</span>':''}</label>${f.hint?`<div class="fhint">${esc(f.hint)}</div>`:''}${input(f)}</div>`;
 }
 html+=`</section><div id="msg"></div><div class="foot"><span class="saved" id="saved"></span><button class="btn" id="send" onclick="submitForm()">Envoyer au cabinet</button></div>`;
 $('app').innerHTML=html;files();progress();
}
function files(){for(const f of CREATION_FIELDS.filter(f=>f.type==='file')){const el=$('files_'+f.key);if(el)el.innerHTML=data.files.filter(x=>x.kind===f.key).map(x=>`<li><span>📄 ${esc(x.name)} <span class="saved">· ${(x.size/1024/1024).toFixed(1)} Mo</span></span><button title="Retirer" onclick="removeFile('${x.id}')">×</button></li>`).join('');}}
function collect(){const out={};for(const f of CREATION_FIELDS)if(f.key&&f.type!=='file'){const el=$('f_'+f.key);if(el)out[f.key]=el.value.trim();}return out;}
function missing(){const v=collect();return CREATION_FIELDS.filter(f=>f.required&&(f.type==='file'?!data.files.some(x=>x.kind===f.key):!v[f.key]));}
function progress(){const req=CREATION_FIELDS.filter(f=>f.required),m=missing().length,pct=Math.round((req.length-m)/req.length*100);$('progress').textContent=`${pct} % des informations obligatoires`;$('bar').style.width=pct+'%';}
function changed(){progress();$('saved').textContent='Modifications en cours…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>save(false),1200);}
function save(final){data.fields=collect();return queue=queue.then(()=>call('',{fields:data.fields,final})).then(()=>{$('saved').textContent='Enregistré à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});},e=>{$('saved').textContent='Enregistrement impossible : '+e.message;throw e;});}
function readB64(file){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>ko(Error('Lecture du fichier impossible'));r.readAsDataURL(file);});}
async function upload(kind,list){
 for(const file of list){
  if(file.size>3*1024*1024){alert(`« ${file.name} » dépasse 3 Mo. Réduis sa taille (scan en qualité standard ou photo) puis réessaie.`);continue;}
  $('saved').textContent=`Envoi de « ${file.name} »…`;
  try{const d=await readB64(file);const x=await (queue=queue.then(()=>call('/file',{kind,name:file.name,type:file.type,data:d})));data.files.push(x);files();progress();$('saved').textContent=`« ${file.name} » ajouté`;}
  catch(e){alert(`« ${file.name} » n’a pas pu être envoyé : ${e.message}`);}
 }
}
async function removeFile(id){try{await (queue=queue.then(()=>call('/file/delete',{id})));data.files=data.files.filter(x=>x.id!==id);files();progress();}catch(e){alert(e.message);}}
async function submitForm(){
 document.querySelectorAll('.invalid').forEach(e=>e.classList.remove('invalid'));
 const m=missing();
 if(m.length){m.forEach(f=>{const el=$('f_'+f.key)||$('files_'+f.key)?.previousElementSibling;el?.classList.add('invalid');});$('msg').innerHTML=`<div class="notice bad">Il manque encore : ${m.map(f=>esc(f.label.split(',')[0])).join(' · ')}.</div>`;($('f_'+m[0].key)||$('files_'+m[0].key))?.scrollIntoView({behavior:'smooth',block:'center'});return;}
 $('send').disabled=true;
 try{clearTimeout(saveTimer);await save(true);data.submittedAt=new Date().toISOString();$('msg').innerHTML='<div class="notice ok"><b>Merci !</b> Vos informations ont été transmises au cabinet. Nous revenons vers vous rapidement avec le projet de statuts.</div>';$('msg').scrollIntoView({behavior:'smooth'});}
 catch(e){$('msg').innerHTML=`<div class="notice bad">Envoi impossible : ${esc(e.message)}</div>`;}
 finally{$('send').disabled=false;}
}
call('').then(x=>{data=x;if(x.cabinet)$('brand').textContent=x.cabinet;page();}).catch(e=>{$('app').innerHTML=`<div class="center">${esc(e.message)}</div>`;});
</script>
</body>
</html>
